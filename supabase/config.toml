# Supabase project config for the Aurixa Systems storefront backend.
project_id = "moeyytuduycrvvncdtme"

[functions.catalog-sync]
verify_jwt = true

[functions.storefront-catalog]
verify_jwt = false

[functions.storefront-setup]
verify_jwt = false

[functions.storefront-wallet]
verify_jwt = false

# Stage 2 readiness questionnaire. Public entry point: authorisation is carried
# by the questionnaire token, not a Supabase JWT. The admin-only `issue` action
# is guarded by the READINESS_ADMIN_SECRET header check inside the function.
[functions.readiness-questionnaire]
verify_jwt = false

# The feedback form and the plan-change notice are reached from a marketing
# page with no login, so authorisation is possession of the `?h=` handoff or
# `?uid=` in the URL — never a Supabase JWT. The browser sends no Authorization
# header at all (see `apiGet` in src/lib/billing.ts), so leaving these to the
# `verify_jwt = true` default 401s every request before the function is reached.
# That is exactly what happened: both were absent here AND undeployed, and the
# feedback page could never load its form.
[functions.storefront-feedback]
verify_jwt = false

[functions.storefront-plan-change]
verify_jwt = false

# Documentation for the Command Center, gated by entitlement. Reached from a
# marketing page with no login and, for customers, from a dashboard link
# carrying a `?h=` handoff — so authorisation is possession of that token, not a
# Supabase JWT. The browser sends no Authorization header, so the default
# `verify_jwt = true` would 401 every request before the function runs.
[functions.storefront-docs]
verify_jwt = false

# Support Portal ticket intake. Reached from a customer dashboard link or the
# public /support page with no login, so the browser sends no Authorization
# header — the default `verify_jwt = true` would 401 every ticket before the
# function runs. Abuse is bounded by the IP throttle inside the function.
[functions.support-ticket]
verify_jwt = false

# The Support Portal's screening assistant (RAG over the NPC dashboard User
# Guide). Same public-form situation as support-ticket: no login, no
# Authorization header. Its own IP throttle bounds abuse, and the reindex/eval
# admin actions are gated by the x-support-admin-key header inside the function.
[functions.support-assistant]
verify_jwt = false

# The public /status page's data source. GET serves a server-side cache of
# anonymized upstream states (no login, no Authorization header); the
# refresh action is gated by x-support-admin-key inside the function.
[functions.status-summary]
verify_jwt = false

# Signed upload URLs for a Briefing Room video, on Mission Control's say-so.
# Mission Control holds no key to this project; an upload is a single-use grant
# token it mints for one listing's next version folder, which this function
# verifies with Mission Control before signing create-only URLs. The caller is
# an operator's browser on Mission Control's origin, which sends no Supabase
# JWT, so authorisation is the grant, not `verify_jwt`.
[functions.briefing-upload-sign]
verify_jwt = false
